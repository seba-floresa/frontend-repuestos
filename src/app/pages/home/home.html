<div class="container mt-5">
  <h4 class="fw-bold mb-4">Lo más reciente 🔥</h4>
  
  <div class="row row-cols-1 row-cols-md-4 g-4">
    
    <div class="col-12" *ngIf="products.length === 0">
      <div class="alert bg-dark text-white border-secondary text-center w-100">
        Cargando catálogo...
      </div>
    </div>

    <div class="col" *ngFor="let p of products">
      <div class="card product-card h-100 shadow-sm text-white">
        
        <div class="bg-white" style="border-radius: 8px 8px 0 0; text-align: center;">
          <img *ngIf="p.image" [src]="p.image.includes('http') ? p.image : 'http://127.0.0.1:8000' + p.image" class="p-3" style="height: 180px; object-fit: contain; width: 100%;" alt="Repuesto">
        </div>
        
        <div class="card-body d-flex flex-column">
          <span class="badge bg-secondary mb-2 align-self-start">{{ p.category?.name || 'Repuesto' }}</span>
          <h6 class="card-title fw-bold text-truncate">{{ p.name }}</h6>
          <p class="card-text text-muted small mb-2">SKU: {{ p.sku }}</p>
          <h4 class="mt-auto fw-bold">${{ p.price }}</h4>
        </div>
        
        <div class="card-footer border-top-0 pt-0 bg-transparent">
          <button class="btn btn-brand w-100 fw-bold">Agregar al Carrito</button>
        </div>
        
      </div>
    </div>

  </div>
</div>
